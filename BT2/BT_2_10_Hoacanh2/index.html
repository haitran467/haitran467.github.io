<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Đăng Ký Mua Hoa</title>
<link href="style.css" rel="stylesheet" type="text/css">
</head>
<body>
  <table width="800" border="0" align="center" cellpadding="0" cellspacing="0" style="border-collapse: collapse;">
  <tbody>
    <tr>
      <td width="190">&nbsp;</td>
      <td width="322">&nbsp;</td>
      <td width="288" align="right" valign="bottom">
        <img src="images/canh_hoa.gif" width="288" height="44" alt="" style="display: block;"/>
      </td>
    </tr>
    <tr>
      <td colspan="2">
        <img src="images/cong.gif" width="512" height="86" alt="" style="display: block;"/>
      </td>
      <td align="right" valign="top">
        <img src="images/Logo.gif" width="288" height="86" alt="" style="display: block;"/>
      </td>
    </tr>
    <tr>
      <td class="vien" valign="top" style="font-size: 0; line-height: 0;">
        <img src="images/cong01.gif" width="190" height="20" alt="" style="display: block;"/><br />
        <a href="../BT_2_2_Hoacanh/index.html"><img src="images/trangchu.gif" width="190" height="47" alt="" style="display: block;"/></a><br />
        <img src="images/tintuc.gif" width="190" height="41" alt="" style="display: block;"/><br />
        <img src="images/Hopthu.gif" width="190" height="39" alt="" style="display: block;"/><br />
        <img src="images/gocthugian.gif" width="190" height="39" alt="" style="display: block;"/><br />
        <img src="images/Hoacaycanh.gif" width="190" height="35" alt="" style="display: block;"/><br />
        <img src="images/hopthu_rose.gif" width="190" height="249" alt="" style="display: block;"/>
      </td>
      <td colspan="2" class="khung-vien" valign="top" style="padding: 10px 0 0 0; margin: 0; background: url('images/socngang.gif') repeat-x bottom, url('images/tem.jpg') no-repeat center; background-size: 100% auto, contain;">
        <table width="100%" border="0" cellspacing="0" cellpadding="0" style="border-collapse: collapse;">
        <tbody>
          <tr>
            <td width="65%" valign="top" style="padding-left: 15px; padding-right: 10px; padding-bottom: 25px;">
              <div class="tieu-de" align="center" style="margin-bottom: 12px; font-family: Tahoma, sans-serif;">ĐĂNG KÝ MUA HOA</div>
              <div class="noi-dung" style="margin-bottom: 15px; line-height: 1.4; font-family: Tahoma, sans-serif;">
                Quý độc giả hãy điền đầy đủ các thông tin theo yêu cầu để nhận được sản phẩm hoa, cây cảnh ưu thích nhất
              </div>
              <form action="#" method="post" style="margin: 0; padding: 0;">
                <table width="100%" border="0" cellspacing="4" cellpadding="0" class="noi-dung" style="font-family: Tahoma, sans-serif;">
                  <tbody>
                    <tr>
                      <td width="30%" align="right">Họ và tên :&nbsp;</td>
                      <td width="70%">
                        <input type="text" name="hoten" style="width: 170px; border: 1px solid #7f9db9;" />
                        <span class="ghi-chu">(*)</span>
                      </td>
                    </tr>
                    <tr>
                      <td align="right">Địa chỉ :&nbsp;</td>
                      <td>
                        <input type="text" name="diachi" style="width: 200px; border: 1px solid #7f9db9;" />
                        <span class="ghi-chu">(*)</span>
                      </td>
                    </tr>
                    <tr>
                      <td align="right">Điện thoại :&nbsp;</td>
                      <td>
                        <input type="text" name="dienthoai" style="width: 110px; border: 1px solid #7f9db9;" />
                        <span class="ghi-chu">(*)</span>
                      </td>
                    </tr>
                    <tr>
                      <td align="right">Email :&nbsp;</td>
                      <td>
                        <input type="text" name="email" style="width: 130px; border: 1px solid #7f9db9;" />
                        <span class="ghi-chu">(*)</span>
                      </td>
                    </tr>
                    <tr>
                      <td align="right">Loại hoa :&nbsp;</td>
                      <td style="vertical-align: middle;">
                        <select name="loaihoa" style="font-family: Tahoma, sans-serif; font-size: 11px; border: 1px solid #7f9db9; padding: 1px; vertical-align: middle;">
                          <option value="Thược Dược">Thược Dược</option>
                          <option value="Hoa Hồng">Hoa Hồng</option>
                          <option value="Hoa Lan">Hoa Lan</option>
                        </select>
                        &nbsp;Màu&nbsp;
                        <select name="mau" style="font-family: Tahoma, sans-serif; font-size: 11px; border: 1px solid #7f9db9; padding: 1px; vertical-align: middle;">
                          <option value="Đỏ">Đỏ</option>
                          <option value="Vàng">Vàng</option>
                          <option value="Trắng">Trắng</option>
                        </select>
                      </td>
                    </tr>
                    <tr>
                      <td align="right">Số lượng :&nbsp;</td>
                      <td>
                        <input type="text" name="soluong" style="width: 50px; border: 1px solid #7f9db9;" />
                        <span class="ghi-chu">(*)</span>
                      </td>
                    </tr>
                    <tr>
                      <td align="right">Đơn vị tính :&nbsp;</td>
                      <td>
                        <input type="radio" name="donvitinh" id="nhanh" value="Nhánh" checked /> <label for="nhanh">Nhánh</label>
                        <input type="radio" name="donvitinh" id="bo" value="Bó" /> <label for="bo">Bó</label>
                        <input type="radio" name="donvitinh" id="chau" value="Chậu" /> <label for="chau">Chậu</label>
                      </td>
                    </tr>
                    <tr>
                      <td align="right">Thanh toán :&nbsp;</td>
                      <td>
                        <input type="radio" name="thanhtoan" id="tienmat" value="Tiền mặt" checked /> <label for="tienmat">Tiền mặt</label><br />
                        <input type="radio" name="thanhtoan" id="chuyenkhoan" value="Chuyển khoản" /> <label for="chuyenkhoan">Chuyển khoản</label><br />
                        <input type="radio" name="thanhtoan" id="mastercard" value="Master card" /> <label for="mastercard">Master card</label>
                      </td>
                    </tr>
                    <tr>
                      <td align="right" valign="top">Yêu cầu :&nbsp;</td>
                      <td>
                        <textarea name="yeucau" style="width: 200px; height: 70px; border: 1px solid #7f9db9; resize: none;"></textarea>
                      </td>
                    </tr>
                    <tr>
                      <td>&nbsp;</td>
                      <td style="padding-top: 8px;">
                        <input type="submit" value="Đăng ký" style="padding: 2px 8px; background: #f0f0f0; border: 1px solid #707070; cursor: pointer; font-size: 11px; font-family: Tahoma, sans-serif;" />
                        <input type="reset" value="Xóa thông tin" style="padding: 2px 8px; background: #f0f0f0; border: 1px solid #707070; cursor: pointer; font-size: 11px; font-family: Tahoma, sans-serif;" />
                      </td>
                    </tr>
                  </tbody>
                </table>
              </form>
            </td>
            <td width="35%" align="center" valign="bottom" style="padding: 0; margin: 0;">
              <img src="images/hoa.gif" width="212" height="398" alt="" style="display: block; margin: 0 auto;"/>
            </td>
          </tr>
        </tbody>
        </table>
      </td>
    </tr>
  </tbody>
</table>
</body>
</html>
