<!DOCTYPE html
	PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<title>Bộ Sưu Tập Cưới - Lê Nam Wedding</title>
	<style type="text/css">
		body {
			margin: 0;
			padding: 0;
			background-color: #f7f9fa;
		}

		/* Khung bọc toàn trang */
		.main-wrapper {
			width: 800px;
			margin: 30px auto;
			background-color: #FFFFFF;
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
			border-radius: 8px;
			overflow: hidden;
			font-family: Arial, Helvetica, sans-serif;
		}

		/* Header Lê Nam */
		.custom-header {
			background: #D20404;
			padding: 20px 30px;
			color: #FFFFFF;
			position: relative;
		}

		.custom-header h2 {
			margin: 0;
			font-family: "Times New Roman", Times, serif;
			font-size: 26px;
			letter-spacing: 1px;
		}

		.custom-header p {
			margin: 5px 0 0 0;
			font-size: 12px;
			opacity: 0.8;
		}

		/* Nút quay lại danh mục */
		.btn-back {
			position: absolute;
			right: 30px;
			top: 25px;
			background-color: rgba(255, 255, 255, 0.2);
			color: #FFFFFF;
			padding: 8px 15px;
			border-radius: 20px;
			text-decoration: none;
			font-size: 13px;
			font-weight: bold;
			transition: all 0.3s;
		}

		.btn-back:hover {
			background-color: #FFFFFF;
			color: #D20404;
		}

		/* Khu vực hiển thị bộ sưu tập */
		.content-section {
			padding: 30px;
		}

		.section-title {
			font-family: "Times New Roman", Times, serif;
			font-size: 22px;
			color: #001F3F;
			border-bottom: 2px solid #D20404;
			padding-bottom: 8px;
			margin-bottom: 25px;
			text-transform: uppercase;
		}

		/* Cập nhật lưới ảnh bằng Flexbox: Tự động chia 3 cột cực chuẩn, không lo lệch hàng */
		.gallery-grid {
			display: flex;
			flex-wrap: wrap;
			gap: 20px 31px;
			/* Khoảng cách giữa các thẻ (Dọc: 20px, Ngang: 31px) */
		}

		.gallery-card {
			width: 226px;
			background: #FFFFFF;
			border: 1px solid #eaeaea;
			border-radius: 6px;
			overflow: hidden;
			text-align: center;
			transition: transform 0.3s, box-shadow 0.3s;
			box-sizing: border-box;
		}

		.gallery-card:hover {
			transform: translateY(-5px);
			box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
			border-color: #D20404;
		}

		.gallery-card img {
			width: 100%;
			height: auto;
			display: block;
		}

		.card-info {
			padding: 12px;
			background-color: #fafafa;
			border-top: 1px solid #eaeaea;
		}

		.card-info h3 {
			margin: 0;
			font-size: 14px;
			color: #333333;
		}

		/* Footer thương hiệu */
		.custom-footer {
			text-align: center;
			padding: 20px;
			font-size: 11px;
			color: #888888;
			border-top: 1px solid #eaeaea;
			background-color: #fafafa;
		}
	</style>
</head>

<body>

	<div class="main-wrapper">
