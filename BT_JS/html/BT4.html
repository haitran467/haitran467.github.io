<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Lời Chào Theo Thời Gian</title>
<style type="text/css">
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #ffffff;
        transition: background 1s ease;
        overflow: hidden;
    }

    /* Thẻ hiển thị kính mờ */
    .greeting-card {
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 24px;
        padding: 50px 70px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        max-width: 500px;
        width: 90%;
    }

    /* Biểu tượng thời gian (Mặt trời/Mặt trăng) */
    .icon {
        font-size: 5rem;
        margin-bottom: 15px;
        display: inline-block;
        animation: float 3s infinite ease-in-out;
    }

    /* Lời chào chính */
    .greeting-text {
        font-size: 2.8rem;
        font-weight: 700;
        letter-spacing: 1px;
        text-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* Hiệu ứng trôi nhẹ cho Icon */
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }
</style>
</head>

<body>

<div class="greeting-card">
    <div id="icon" class="icon">✨</div>
    <div id="loi-chao" class="greeting-text">Đang tải...</div>
</div>

<script type="text/javascript">
    function capNhatLoiChao() {
        var d = new Date();
        var time = d.getHours();

        var loiChao = "";
        var icon = "";
        var backgroundGradients = "";

        // Kiểm tra điều kiện thời gian
        if (time < 10) {
            loiChao = "Chào buổi sáng!";
            icon = "🌅";
            backgroundGradients = "linear-gradient(135deg, #ff7e5f, #feb47b)";
        } else if (time < 17) {
            loiChao = "Chào buổi chiều!";
            icon = "☀️";
            backgroundGradients = "linear-gradient(135deg, #2980b9, #6dd5fa)";
        } else {
            loiChao = "Chào buổi tối!";
            icon = "🌙";
            backgroundGradients = "linear-gradient(135deg, #0f2027, #203a43, #2c5364)";
        }

        // Cập nhật giao diện
        document.getElementById("loi-chao").innerText = loiChao;
        document.getElementById("icon").innerText = icon;
        document.body.style.background = backgroundGradients;
    }

    // Chạy hàm khi tải trang
    capNhatLoiChao();
</script>

</body>
</html>
